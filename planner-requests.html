<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Requests - SDU Timetable Planner</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="plannerRequests" data-role="planner" data-variant="A">
  <div class="frame">
    <aside id="sidebar"></aside>
    <main class="main">
      <h1>My Courses</h1>
      <p class="hint">Select a course, then show its suggested timetable or the teacher's request details.</p>
      <div class="grow"><table id="courses"></table></div>
      <div class="actions">
        <button type="button" class="btn" id="showSuggested">Show Suggested Timetable</button>
        <button type="button" class="btn purple" id="viewDetails">View Request Details</button>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
