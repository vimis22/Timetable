<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Room Allocation - SDU Timetable Planner</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="plannerRooms" data-role="planner">
  <div class="frame">
    <aside id="sidebar"></aside>
    <main class="main">
      <h1>Room Allocation</h1>
      <div class="req row-inline">
        <label for="course">Course:</label>
        <select id="course"></select>
        <label for="est">Est. Students:</label>
        <input type="number" id="est" min="1" max="500">
      </div>
      <div class="actions tight"><button type="button" class="btn purple" id="seeRequest">See Teacher Request</button></div>
      <div id="teacherReq" class="course-info planner-info" hidden></div>
      <h2 class="sub">Available Rooms (This Faculty Only)</h2>
      <div class="req-list"><table id="rooms"></table></div>
      <h2 class="sub">Suggested Allocations:</h2>
      <div id="suggestions" class="suggest-box"></div>
      <div class="actions"><button type="button" class="btn purple" id="save">Save To Schedule</button></div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
