<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SDU Timetable</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="login">
  <div class="frame login">
    <h1>SDU TIMETABLE<br>MANAGEMENT SYSTEM</h1>
    <form id="loginForm" novalidate>
      <label for="username">Username:</label>
      <input id="username" name="username" autocomplete="username" placeholder="teacher or planner" autofocus>
      <p class="login-hint">Prototype for usability testing: enter <b>teacher</b> or <b>planner</b>. No password is needed.</p>
      <button type="submit">Login</button>
      <div class="error" role="alert"></div>
    </form>
  </div>
  <script src="app.js"></script>
</body>
</html>
