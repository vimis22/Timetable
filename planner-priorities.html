<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Priorities - SDU Timetable Planner</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="plannerPriorities" data-role="planner">
  <div class="frame">
    <aside id="sidebar"></aside>
    <main class="main">
      <h1>Scheduling Priorities &amp;<br>Constraints</h1>
      <p class="hint">Rank the rules used when slots and rooms compete. Rank 1 wins.</p>
      <div id="prioList" class="prio-list"></div>
      <div class="actions">
        <button type="button" class="btn red" id="reset">Reset</button>
        <button type="button" class="btn purple" id="save">Save Priorities</button>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
